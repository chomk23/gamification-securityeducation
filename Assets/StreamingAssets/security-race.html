<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SECURITY RACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-pink:   #ff2d95;
      --neon-cyan:   #00f0ff;
      --neon-yellow: #fff200;
      --neon-purple: #b026ff;
      --neon-orange: #ff6b00;
      --neon-green:  #39ff14;
      --bg-deep:     #0a0118;
      --bg-mid:      #1e0b3c;
      --bg-band:     #2a0e58;
      --text-cream:  #ffe8d0;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Press Start 2P', monospace;
    }
    .ko, .ko * {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 16px 40px;
      color: var(--text-cream);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(176, 38, 255, 0.35) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255, 45, 149, 0.25) 0%, transparent 60%);
      overflow-x: hidden;
      image-rendering: pixelated;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 7%  12%, white, transparent),
        radial-gradient(1px 1px at 21% 28%, white, transparent),
        radial-gradient(1px 1px at 35% 16%, white, transparent),
        radial-gradient(1px 1px at 48% 22%, white, transparent),
        radial-gradient(1px 1px at 62% 8%,  white, transparent),
        radial-gradient(1px 1px at 79% 18%, white, transparent),
        radial-gradient(1px 1px at 91% 31%, white, transparent),
        radial-gradient(2px 2px at 14% 42%, white, transparent),
        radial-gradient(1px 1px at 88% 47%, white, transparent),
        radial-gradient(1px 1px at 4%  60%, white, transparent),
        radial-gradient(1px 1px at 96% 70%, white, transparent),
        radial-gradient(2px 2px at 30% 75%, white, transparent);
      opacity: 0.7;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.45; }
      to   { opacity: 0.85; }
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      z-index: 100;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* 자동차 화면(좌)과 문제 화면(우)을 가로로 배치 */
    .race-row {
      display: flex;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 14px;
    }
    .race-row > .race-viewport {
      flex: 1.3 1 0;
      min-width: 0;
      margin-bottom: 0;
    }
    .race-row > .question-card {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    @media (max-width: 900px) {
      .race-row { flex-direction: column; }
      .race-row > .race-viewport { margin-bottom: 14px; }
    }

    .pixel-frame {
      border: 4px solid var(--neon-cyan);
      background: var(--bg-mid);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-cyan),
        0 0 30px rgba(0, 240, 255, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .game-header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
      margin-bottom: 22px;
    }
    .arcade-title {
      font-size: 14px;
      color: var(--neon-pink);
      text-shadow:
        0 0 4px var(--neon-pink),
        0 0 14px var(--neon-pink),
        2px 2px 0 var(--neon-purple);
      letter-spacing: 4px;
    }

    .intro-card { padding: 36px 28px; text-align: center; }
    .intro-title {
      font-size: 20px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 8px var(--neon-yellow),
        3px 3px 0 var(--neon-pink),
        4px 4px 0 var(--neon-purple);
      margin: 18px 0 16px;
      letter-spacing: 3px;
      line-height: 1.5;
    }
    .intro-sub {
      font-size: 13px;
      color: var(--text-cream);
      line-height: 1.9;
      margin-bottom: 22px;
    }
    .info-chips {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 22px 0;
    }
    .info-chip {
      padding: 14px 6px;
      border: 3px solid;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .info-chip .chip-label {
      font-size: 7px;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      opacity: 0.75;
    }
    .info-chip .chip-value {
      font-size: 10px;
      letter-spacing: 1px;
    }
    .chip-correct { border-color: var(--neon-green);  box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }
    .chip-correct .chip-value { color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); }
    .chip-wrong   { border-color: var(--neon-pink);   box-shadow: 0 0 10px rgba(255, 45, 149, 0.3); }
    .chip-wrong .chip-value { color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }
    .chip-time    { border-color: var(--neon-cyan);   box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
    .chip-time .chip-value { color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan); }

    .arcade-btn {
      display: inline-block;
      padding: 18px 36px;
      background: var(--neon-pink);
      color: var(--bg-deep);
      border: none;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 8px 0 var(--neon-purple),
        0 0 24px rgba(255, 45, 149, 0.5);
      transition: transform 0.08s, box-shadow 0.08s;
      animation: btn-pulse 1.4s ease-in-out infinite alternate;
      text-transform: uppercase;
      margin-top: 8px;
      font-family: 'Press Start 2P', monospace;
    }
    .arcade-btn:hover { transform: translateY(-2px); }
    .arcade-btn:active {
      transform: translateY(6px);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 2px 0 var(--neon-purple),
        0 0 24px rgba(255, 45, 149, 0.5);
    }
    @keyframes btn-pulse {
      from {
        box-shadow:
          0 0 0 4px var(--bg-deep),
          0 0 0 8px var(--neon-pink),
          0 8px 0 var(--neon-purple),
          0 0 20px rgba(255, 45, 149, 0.4);
      }
      to {
        box-shadow:
          0 0 0 4px var(--bg-deep),
          0 0 0 8px var(--neon-pink),
          0 8px 0 var(--neon-purple),
          0 0 40px rgba(255, 45, 149, 0.9);
      }
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .hud-card {
      padding: 12px 8px;
      border: 3px solid var(--neon-cyan);
      background: var(--bg-mid);
      text-align: center;
      box-shadow: inset 0 0 12px rgba(0, 240, 255, 0.1);
    }
    .hud-label {
      font-size: 7px;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }
    .hud-value {
      font-size: 18px;
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow), 0 0 16px rgba(255, 242, 0, 0.5);
      letter-spacing: 1px;
    }

    .minimap {
      position: relative;
      height: 30px;
      border: 3px solid var(--neon-purple);
      background: var(--bg-deep);
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(176, 38, 255, 0.4);
    }
    .mini-track-line {
      position: absolute;
      left: 8px; right: 24px;
      top: 50%; height: 2px;
      transform: translateY(-50%);
      background-image: repeating-linear-gradient(
        to right,
        var(--neon-purple) 0 4px,
        transparent 4px 10px
      );
      opacity: 0.7;
    }
    .mini-finish {
      position: absolute;
      right: 4px; top: 4px; bottom: 4px;
      width: 10px;
      background: repeating-linear-gradient(to bottom, white 0 4px, var(--bg-deep) 4px 8px);
      box-shadow: 0 0 8px white;
    }
    .mini-dot {
      position: absolute;
      top: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, -50%);
      transition: left 0.18s linear;
    }
    .mini-dot.player {
      background: var(--neon-yellow);
      box-shadow: 0 0 8px var(--neon-yellow);
      z-index: 3;
      width: 12px; height: 12px;
    }
    .mini-dot.ai1 { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); z-index: 2; }
    .mini-dot.ai2 { background: var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink); z-index: 1; }

    .race-viewport {
      position: relative;
      height: 420px;
      overflow: hidden;
      border: 4px solid var(--neon-pink);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-pink),
        0 0 40px rgba(255, 45, 149, 0.5),
        inset 0 0 60px rgba(0, 0, 0, 0.7);
      margin-bottom: 14px;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(176, 38, 255, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(255, 45, 149, 0.18) 0%, transparent 50%),
        #0a0118;
    }

    .race-viewport::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 1px,
        rgba(0, 0, 0, 0.25) 1px,
        rgba(0, 0, 0, 0.25) 2px
      );
      pointer-events: none;
      z-index: 60;
    }
    .race-viewport::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 55;
    }

    .grid-floor {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(to right,
          transparent 0, transparent 39px,
          rgba(0, 240, 255, 0.10) 39px, rgba(0, 240, 255, 0.10) 40px),
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 39px,
          rgba(255, 45, 149, 0.10) 39px, rgba(255, 45, 149, 0.10) 40px);
      pointer-events: none;
      z-index: 1;
    }

    .race-world {
      position: absolute;
      left: 0; top: 0;
      will-change: transform;
      transition: transform 0.18s linear;
      z-index: 10;
    }
    .race-world.no-tx { transition: none; }

    #road-svg {
      position: absolute;
      left: 0; top: 0;
      shape-rendering: geometricPrecision;
      pointer-events: none;
    }

    .marker-sign {
      position: absolute;
      width: 34px; height: 36px;
      transform: translate(-50%, -100%);
      z-index: 11;
    }
    .marker-sign .post {
      position: absolute;
      left: 50%; bottom: 0;
      width: 4px; height: 18px;
      background: linear-gradient(to bottom, #555, #888);
      transform: translateX(-50%);
    }
    .marker-sign .board {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 16px;
      background: var(--neon-cyan);
      color: var(--bg-deep);
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      font-family: 'Press Start 2P', monospace;
      box-shadow:
        0 0 0 2px var(--bg-deep),
        0 0 0 4px var(--neon-cyan),
        0 0 10px var(--neon-cyan);
    }

    .finish-gate {
      position: absolute;
      width: 22px; height: 180px;
      transform: translate(-50%, -50%);
      background-color: white;
      background-image:
        linear-gradient(45deg, var(--bg-deep) 25%, transparent 25%, transparent 75%, var(--bg-deep) 75%),
        linear-gradient(45deg, var(--bg-deep) 25%, transparent 25%, transparent 75%, var(--bg-deep) 75%);
      background-size: 22px 22px;
      background-position: 0 0, 11px 11px;
      box-shadow:
        0 0 0 3px var(--bg-deep),
        0 0 0 6px var(--neon-yellow),
        0 0 25px var(--neon-yellow);
      z-index: 9;
    }
    .finish-banner {
      position: absolute;
      font-size: 12px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 8px var(--neon-yellow),
        2px 2px 0 var(--neon-pink),
        3px 3px 0 var(--neon-purple);
      letter-spacing: 3px;
      transform: translate(-50%, -150px);
      z-index: 12;
      animation: finish-pulse 1s ease-in-out infinite alternate;
      white-space: nowrap;
      font-family: 'Press Start 2P', monospace;
    }
    @keyframes finish-pulse {
      from { transform: translate(-50%, -150px) scale(1); }
      to   { transform: translate(-50%, -154px) scale(1.05); }
    }

    .race-viewport.boosting::before {
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 1px,
          rgba(0, 0, 0, 0.25) 1px,
          rgba(0, 0, 0, 0.25) 2px
        ),
        repeating-linear-gradient(to right,
          rgba(255, 242, 0, 0.35) 0 6px,
          transparent 6px 30px,
          rgba(0, 240, 255, 0.3) 30px 36px,
          transparent 36px 60px);
      animation: streak 0.25s linear infinite;
    }
    @keyframes streak {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 0 0, -60px 0; }
    }

    .car {
      position: absolute;
      left: 0; top: 0;
      transition: left 0.18s linear, top 0.18s linear, transform 0.18s linear;
      filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7));
    }
    .car svg {
      display: block;
      shape-rendering: crispEdges;
    }
    .car.player {
      z-index: 20;
      filter:
        drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 8px rgba(255, 242, 0, 0.6));
    }
    .car-label {
      position: absolute;
      left: 50%; top: -16px;
      transform: translateX(-50%);
      font-size: 7px;
      letter-spacing: 1.5px;
      color: white;
      text-shadow: 1px 1px 0 var(--bg-deep), 0 0 4px var(--bg-deep);
      white-space: nowrap;
    }
    .car.player .car-label {
      color: var(--neon-yellow);
      text-shadow:
        1px 1px 0 var(--bg-deep),
        0 0 6px var(--neon-yellow);
    }
    .car.ai1 .car-label   { color: var(--neon-cyan); text-shadow: 1px 1px 0 var(--bg-deep), 0 0 5px var(--neon-cyan); }
    .car.ai2 .car-label   { color: var(--neon-pink); text-shadow: 1px 1px 0 var(--bg-deep), 0 0 5px var(--neon-pink); }

    .car.ai1.boosting-ai {
      filter:
        drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 14px var(--neon-cyan))
        brightness(1.25);
    }
    .car.ai2.boosting-ai {
      filter:
        drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
        drop-shadow(0 0 14px var(--neon-pink))
        brightness(1.25);
    }

    .speed-burst { animation: burst 0.6s ease; }
    @keyframes burst {
      0%, 100% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 8px rgba(255, 242, 0, 0.6));
      }
      30% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 20px var(--neon-yellow))
          drop-shadow(0 0 30px var(--neon-pink))
          brightness(1.5) hue-rotate(40deg);
      }
      60% {
        filter:
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          drop-shadow(0 0 20px var(--neon-cyan))
          brightness(1.5) hue-rotate(-40deg);
      }
    }
    .car.player.boosting::after {
      content: '';
      position: absolute;
      right: 100%; top: 50%;
      transform: translateY(-50%);
      width: 90px; height: 22px;
      background: linear-gradient(to left,
        var(--neon-yellow) 0%,
        var(--neon-orange) 30%,
        var(--neon-pink) 60%,
        transparent 100%);
      mix-blend-mode: screen;
      animation: trail 0.18s linear infinite alternate;
      margin-right: -2px;
      filter: blur(1px);
    }
    @keyframes trail {
      from { opacity: 0.8; transform: translateY(-50%) scaleX(1); }
      to   { opacity: 1;   transform: translateY(-50%) scaleX(1.25); }
    }

    .shake { animation: hit-flash 0.4s; }
    @keyframes hit-flash {
      0%, 100% {
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7));
      }
      40% {
        filter:
          drop-shadow(0 0 14px var(--neon-pink))
          drop-shadow(0 0 24px var(--neon-pink))
          drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.7))
          brightness(1.4) saturate(2);
      }
    }

    .question-card {
      padding: 22px;
      background: var(--bg-mid);
      border: 4px solid var(--neon-green);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-green),
        0 0 30px rgba(57, 255, 20, 0.4);
      position: relative;
    }
    .q-number {
      display: inline-block;
      padding: 6px 12px;
      background: var(--neon-green);
      color: var(--bg-deep);
      font-size: 8px;
      margin-bottom: 14px;
      letter-spacing: 2px;
      box-shadow: 3px 3px 0 var(--bg-deep);
    }
    .q-text {
      font-size: 13px;
      color: var(--text-cream);
      margin-bottom: 18px;
      line-height: 1.7;
      letter-spacing: 0.3px;
    }
    .q-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .answer-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: transparent;
      border: 3px solid var(--text-cream);
      color: var(--text-cream);
      font-size: 11px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 0.2px;
      line-height: 1.5;
    }
    .answer-btn .letter {
      display: inline-flex;
      width: 26px; height: 26px;
      align-items: center;
      justify-content: center;
      background: var(--text-cream);
      color: var(--bg-deep);
      font-size: 11px;
      font-family: 'Press Start 2P', monospace;
      flex-shrink: 0;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      transform: translate(-3px, -3px);
      box-shadow: 5px 5px 0 var(--neon-cyan);
    }
    .answer-btn:hover:not(:disabled) .letter {
      background: var(--neon-cyan);
    }
    .answer-btn.correct {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(57, 255, 20, 0.12);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.5);
    }
    .answer-btn.correct .letter { background: var(--neon-green); }
    .answer-btn.wrong {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: rgba(255, 45, 149, 0.12);
    }
    .answer-btn.wrong .letter { background: var(--neon-pink); }
    .answer-btn:disabled { cursor: default; }

    .result-card {
      padding: 36px 28px;
      text-align: center;
      border-color: var(--neon-yellow);
      box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--neon-yellow),
        0 0 40px rgba(255, 242, 0, 0.5);
    }
    .result-title-big {
      font-size: 24px;
      color: var(--neon-yellow);
      text-shadow:
        0 0 10px var(--neon-yellow),
        3px 3px 0 var(--neon-pink),
        5px 5px 0 var(--neon-purple);
      letter-spacing: 4px;
      margin-bottom: 14px;
      animation: result-glow 1.4s ease-in-out infinite alternate;
    }
    @keyframes result-glow {
      from { text-shadow: 0 0 6px var(--neon-yellow), 3px 3px 0 var(--neon-pink), 5px 5px 0 var(--neon-purple); }
      to   { text-shadow: 0 0 22px var(--neon-yellow), 3px 3px 0 var(--neon-pink), 5px 5px 0 var(--neon-purple); }
    }
    .result-sub {
      font-size: 13px;
      color: var(--text-cream);
      margin-bottom: 26px;
      line-height: 1.8;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat-card {
      padding: 16px 6px;
      border: 3px solid;
      background: var(--bg-mid);
    }
    .stat-card.gold  { border-color: var(--neon-yellow); }
    .stat-card.cyan  { border-color: var(--neon-cyan); }
    .stat-card.green { border-color: var(--neon-green); }
    .stat-label {
      font-size: 7px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.8;
    }
    .stat-value {
      font-size: 18px;

// ===== Web Audio 효과음 (procedural) =====
let _audioCtx = null;
function _ctx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function _tone(freq, dur, type, vol) {
  const ctx = _ctx(); if (!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function _seq(freqs, step, type, vol) {
  freqs.forEach((f, i) => setTimeout(() => _tone(f, step * 1.3, type, vol), i * step * 1000));
}
// 정답 — 상승 arpeggio
function sfxCorrect() { _seq([523, 659, 784, 1047], 0.06, 'square', 0.16); }
// 오답 — 하강 부저
function sfxWrong()   { _seq([196, 165, 131], 0.10, 'square', 0.16); }
// 대시/부스트 — 주파수 스윕(슝)
function sfxDash() {
  const ctx = _ctx(); if (!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(140, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.28);
  gain.gain.setValueAtTime(0.11, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0008, ctx.currentTime + 0.28);
  osc.connect(gain).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.28);
}
// 시작 — 출발 카운트 느낌
function sfxStart()   { _seq([392, 392, 523, 659], 0.12, 'square', 0.16); }

function sfxQuestion(){ _tone(880, 0.05, 'square', 0.10); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setupWorld() {
  const world = document.getElementById('world');
  world.style.width  = WORLD_WIDTH  + 'px';
  world.style.height = WORLD_HEIGHT + 'px';

  const svg = document.getElementById('road-svg');
  svg.setAttribute('width',  WORLD_WIDTH);
  svg.setAttribute('height', WORLD_HEIGHT);
  svg.setAttribute('viewBox', `0 0 ${WORLD_WIDTH} ${WORLD_HEIGHT}`);
  document.getElementById('path-road').setAttribute('d', TRACK_PATH_D);
  document.getElementById('path-glow').setAttribute('d', TRACK_PATH_D);

  trackPathEl = document.getElementById('path-road');
  trackLength = trackPathEl.getTotalLength();

  function offsetPath(distOffset, samples = 240) {
    const pts = [];
    for (let i = 0; i <= samples; i++) {
      const d = (i / samples) * trackLength;
      const p = trackPathEl.getPointAtLength(d);
      const p2 = trackPathEl.getPointAtLength(Math.min(trackLength, d + 1.5));
      const dx = p2.x - p.x, dy = p2.y - p.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      pts.push(`${(p.x + nx * distOffset).toFixed(1)},${(p.y + ny * distOffset).toFixed(1)}`);
    }
    return 'M ' + pts.join(' L ');
  }
  document.getElementById('path-edge-top').setAttribute('d', offsetPath(-86));
  document.getElementById('path-edge-bot').setAttribute('d', offsetPath(86));
  document.getElementById('path-div-top').setAttribute('d', offsetPath(-29));
  document.getElementById('path-div-bot').setAttribute('d', offsetPath(29));

  const markers = document.getElementById('markers');
  markers.innerHTML = '';
  [25, 50, 75].forEach(p => {
    const d = (p / 100) * trackLength;
    const pos = trackPathEl.getPointAtLength(d);
    const ahead = trackPathEl.getPointAtLength(Math.min(trackLength, d + 1.5));
    const dx = ahead.x - pos.x, dy = ahead.y - pos.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const signX = pos.x + nx * -110;
    const signY = pos.y + ny * -110;
    const sign = document.createElement('div');
    sign.className = 'marker-sign';
    sign.style.left = signX + 'px';
    sign.style.top  = signY + 'px';
    sign.innerHTML = `<div class="board">${p}%</div><div class="post"></div>`;
    markers.appendChild(sign);
  });

  const endP = trackPathEl.getPointAtLength(trackLength);
  const beforeP = trackPathEl.getPointAtLength(Math.max(0, trackLength - 1.5));
  const fAngle = Math.atan2(endP.y - beforeP.y, endP.x - beforeP.x) * 180 / Math.PI;
  const flag = document.getElementById('finish-flag');
  flag.style.left = endP.x + 'px';
  flag.style.top  = endP.y + 'px';
  flag.style.transform = `translate(-50%, -50%) rotate(${fAngle}deg)`;
  const ftext = document.getElementById('finish-text');
  ftext.style.left = endP.x + 'px';
  ftext.style.top  = endP.y + 'px';

  world.classList.add('no-tx');
  world.style.transform = 'translate(0px, 0px)';
  requestAnimationFrame(() => world.classList.remove('no-tx'));
}

function startRace() {
  playerPos = ai1Pos = ai2Pos = 0;
  playerFinishAt = ai1FinishAt = ai2FinishAt = 0;
  cameraX = cameraY = 0;
  correctCount = 0;
  totalAnswered = 0;
  currentQIdx = 0;
  playerBoostUntil = 0;
  playerSlowUntil = 0;
  ai1BoostUntil = 0; ai1NextBoostAt = performance.now() + 2000 + Math.random() * 2000;
  ai2BoostUntil = 0; ai2NextBoostAt = performance.now() + 2500 + Math.random() * 2500;
  questionPool = shuffle(QUESTIONS);

  document.getElementById('intro').style.display = 'none';
  document.getElementById('game').style.display = 'block';

  setupWorld();
  updateCarPos('player', 0, 0);
  updateCarPos('ai1', 0, -1);
  updateCarPos('ai2', 0, 1);
  updateMinimap();

  showQuestion();

  raceStart = performance.now();
  lastFrame = performance.now();
  raceRunning = true;
  sfxStart();   // 출발 사운드
  requestAnimationFrame(loop);
}

function loop(now) {
  if (!raceRunning) return;
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  const elapsed = (now - raceStart) / 1000;
  const remaining = Math.max(0, RACE_TIME - elapsed);

  let playerSpeed = PLAYER_BASE;
  const boosting = now < playerBoostUntil;
  if (boosting)              playerSpeed = PLAYER_BOOST;
  if (now < playerSlowUntil) playerSpeed = 0;
  playerPos = Math.min(100, playerPos + playerSpeed * dt);

  if (now >= ai1NextBoostAt) {
    const dur = 1000 + Math.random() * 800;
    ai1BoostUntil = now + dur;
    ai1NextBoostAt = ai1BoostUntil + 2000 + Math.random() * 2000;
  }
  if (now >= ai2NextBoostAt) {
    const dur = 900 + Math.random() * 700;
    ai2BoostUntil = now + dur;
    ai2NextBoostAt = ai2BoostUntil + 2500 + Math.random() * 2500;
  }
  const ai1Boosting = now < ai1BoostUntil;
  const ai2Boosting = now < ai2BoostUntil;
  const ai1Speed = ai1Boosting ? AI1_SPEED * AI_BOOST_MULT : AI1_SPEED;
  const ai2Speed = ai2Boosting ? AI2_SPEED * AI_BOOST_MULT : AI2_SPEED;
  ai1Pos = Math.min(100, ai1Pos + ai1Speed * dt);
  ai2Pos = Math.min(100, ai2Pos + ai2Speed * dt);
  if (playerPos >= 100 && !playerFinishAt) playerFinishAt = now;
  if (ai1Pos >= 100 && !ai1FinishAt) ai1FinishAt = now;
  if (ai2Pos >= 100 && !ai2FinishAt) ai2FinishAt = now;

  document.getElementById('ai1').classList.toggle('boosting-ai', ai1Boosting);
  document.getElementById('ai2').classList.toggle('boosting-ai', ai2Boosting);

  updateCarPos('player', playerPos, 0);
  updateCarPos('ai1', ai1Pos, -1);
  updateCarPos('ai2', ai2Pos, 1);
  updateCamera();
  updateMinimap();

  const viewport = document.getElementById('viewport');
  const playerEl = document.getElementById('player');
  if (boosting) {
    viewport.classList.add('boosting');
    playerEl.classList.add('boosting');
  } else {
    viewport.classList.remove('boosting');
    playerEl.classList.remove('boosting');
  }

  document.getElementById('time-left').textContent     = remaining.toFixed(1);
  document.getElementById('progress-pct').textContent  = Math.round(playerPos) + '%';
  document.getElementById('correct-count').textContent = correctCount;

  if (playerPos >= 100 || remaining <= 0) {
    endRace();
    return;
  }
  requestAnimationFrame(loop);
}

function carWorldPos(pct, laneIdx) {
  if (!trackPathEl) return { x: 0, y: 0, angle: 0 };
  const d = (pct / 100) * trackLength;
  const p = trackPathEl.getPointAtLength(d);
  const ahead = trackPathEl.getPointAtLength(Math.min(trackLength, d + 2));
  const dx = ahead.x - p.x, dy = ahead.y - p.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const offset = laneIdx * LANE_OFFSET;
  return {
    x: p.x + nx * offset,
    y: p.y + ny * offset,
    angle: Math.atan2(dy, dx) * 180 / Math.PI,
  };
}

function updateCarPos(id, pct, laneIdx) {
  const el = document.getElementById(id);
  if (!el) return;
  const { x, y, angle } = carWorldPos(pct, laneIdx);
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
}

function updateCamera() {
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const vw = viewport.offsetWidth;
  const vh = viewport.offsetHeight;
  const player = carWorldPos(playerPos, 0);
  let tx = player.x - vw * 0.32;
  let ty = player.y - vh * 0.50;
  tx = Math.max(0, Math.min(WORLD_WIDTH - vw, tx));
  ty = Math.max(0, Math.min(WORLD_HEIGHT - vh, ty));
  cameraX = tx;
  cameraY = ty;
  world.style.transform = `translate(${-cameraX}px, ${-cameraY}px)`;
}

function updateMinimap() {
  const mini = document.querySelector('.minimap');
  if (!mini) return;
  const total = mini.offsetWidth - 32;
  const startX = 8;
  ['player', 'ai1', 'ai2'].forEach(name => {
    const dot = document.getElementById('mini-' + name);
    if (!dot) return;
    const pos = name === 'player' ? playerPos : (name === 'ai1' ? ai1Pos : ai2Pos);
    dot.style.left = (startX + (pos / 100) * total) + 'px';
  });
}

function showQuestion() {
  const q = questionPool[currentQIdx % questionPool.length];
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.answer }));
  const shuffledOpts = shuffle(tagged);
  const correctIdx = shuffledOpts.findIndex(o => o.isCorrect);
  currentShuffled = { shuffledOpts, correctIdx };

  document.getElementById('q-number').textContent = `QUESTION ${totalAnswered + 1}`;
  document.getElementById('q-text').textContent = q.q;
  const opts = document.getElementById('q-options');
  opts.innerHTML = shuffledOpts.map((o, i) =>
    `<button class="answer-btn" onclick="answer(${i})">
       <span class="letter">${'ABCD'[i]}</span>
       <span class="ko">${o.opt}</span>
     </button>`
  ).join('');
  sfxQuestion();   // 새 문제 등장 알림음
}

function answer(idx) {
  if (!currentShuffled) return;
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.disabled = true);

  const correct = (idx === currentShuffled.correctIdx);
  if (correct) {
    buttons[idx].classList.add('correct');
    correctCount++;
    playerPos = Math.min(100, playerPos + CORRECT_JUMP);
    if (playerPos >= 100 && !playerFinishAt) playerFinishAt = performance.now();
    playerBoostUntil = performance.now() + BOOST_DURATION;
    const player = document.getElementById('player');
    player.classList.add('speed-burst');
    setTimeout(() => player.classList.remove('speed-burst'), 600);
    sfxCorrect();
    sfxDash();   // 정답 → 부스트 대시 슝
  } else {
    buttons[idx].classList.add('wrong');
    buttons[currentShuffled.correctIdx].classList.add('correct');
    playerSlowUntil = performance.now() + SLOW_DURATION;
    const player = document.getElementById('player');
    player.classList.add('shake');
    setTimeout(() => player.classList.remove('shake'), 400);
    sfxWrong();
  }
  totalAnswered++;

  setTimeout(() => {
    if (!raceRunning) return;
    currentQIdx++;
    showQuestion();
  }, 900);
}

function endRace() {
  raceRunning = false;
  document.getElementById('viewport').classList.remove('boosting');
  const playerEl = document.getElementById('player');
  if (playerEl) playerEl.classList.remove('boosting');

  const elapsed = Math.min(RACE_TIME, (performance.now() - raceStart) / 1000);
  const finished = playerPos >= 100;

  // 완주 여부에 따라 결과 사운드
  if (finished) sfxFinish();
  else sfxLose();

  // 완주한 차는 결승선 통과 시각 순, 미완주 차는 진행률 순으로 뒤에 둔다.
  // (위치는 100%에서 멈추므로 위치만 비교하면 늦게 들어와도 동률 → 1등이 되던 문제)
  const positions = [
    { name: 'YOU',  pos: playerPos, at: playerFinishAt },
    { name: 'AI 1', pos: ai1Pos,    at: ai1FinishAt },
    { name: 'AI 2', pos: ai2Pos,    at: ai2FinishAt },
  ].sort((a, b) => {
    if (a.at && b.at) return a.at - b.at;
    if (a.at) return -1;
    if (b.at) return 1;
    return b.pos - a.pos;
  });
  const myRank = positions.findIndex(p => p.name === 'YOU') + 1;
  // 미완주(TIME UP)는 앞서 있어도 클리어가 아니므로 Unity에는 0(미완주)으로 보고
  const reportRank = finished ? myRank : 0;

  let finalScore, subText, bigTitle;
  if (finished) {
    const timeBonus = Math.round((RACE_TIME - elapsed) / RACE_TIME * 30);
    finalScore = Math.min(100, 70 + timeBonus);
    if (myRank === 1) {
      bigTitle = '★ 1ST PLACE ★';
      subText = '모든 차를 제치고 우승했습니다!';
    } else if (myRank === 2) {
      bigTitle = 'RACE CLEAR';
      subText = '2등 — 결승선을 통과했습니다!';
    } else {
      bigTitle = 'RACE CLEAR';
      subText = '결승선 통과! 시간 내 완주했습니다.';
    }
  } else {
    finalScore = Math.round(playerPos * 0.7);
    bigTitle = 'TIME UP';
    subText = '시간 초과 — 다음엔 더 빠르게 답해보세요.';
  }

  document.getElementById('game').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result-title-big').textContent = bigTitle;
  document.getElementById('result-sub').textContent = subText;
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('final-progress').textContent = Math.round(playerPos) + '%';
  document.getElementById('final-correct').textContent = `${correctCount}/${totalAnswered}`;
  document.getElementById('rank-info').textContent =
    (finished ? `RANK ${myRank} / 3` : 'DNF (미완주)') + '   ·   ' +
    positions.map(p => `${p.name} ${Math.round(p.pos)}%`).join(' · ');

  // Unity Web Browser 임베드 환경에서 등수를 Unity 측으로 전달
  // (uwb 객체는 UWB 엔진이 자동 주입; 외부 브라우저에선 undefined라 무시됨)
  try {
    if (typeof uwb !== 'undefined' && uwb.ExecuteJsMethod) {
      uwb.ExecuteJsMethod('OnRaceFinished', reportRank);
    }
  } catch (e) { /* 외부 브라우저 환경 */ }

  // WebGL(iframe) 환경: 부모 창(Unity WebGL 페이지)으로 등수 전달
  // (RacingIframe.jslib의 message 리스너가 SendMessage로 Unity에 전달)
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'securityRaceFinished', rank: reportRank }, '*');
    }
  } catch (e) { /* standalone 환경 */ }
}

// ── 웹(iframe) 임베드: 닫기 버튼 + ESC → 부모(Unity WebGL 페이지)에 취소 알림 ──
// iframe이 키 포커스를 가져가 Unity가 ESC를 못 받으므로 여기서 처리한다.
const IN_IFRAME = (() => {
  try { return window.parent && window.parent !== window; } catch (e) { return true; }
})();

function requestClose() {
  if (!IN_IFRAME) return;
  raceRunning = false;
  try { window.parent.postMessage({ type: 'securityRaceCancel' }, '*'); } catch (e) {}
}

if (IN_IFRAME) {
  document.getElementById('embed-close').style.display = 'block';
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); requestClose(); }
  });
}
</script>
